<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Thank You</title>
<style>
  :root { --primary: {{COLOR_PRIMARY}}; --secondary: {{COLOR_SECONDARY}}; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--secondary); font-family: 'Jost', Arial, sans-serif; color: #fff; text-align: center; padding: 24px;
  }
  .box { max-width: 420px; }
  .check {
    width: 64px; height: 64px; border-radius: 50%; background: var(--primary);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 30px;
  }
  h1 { font-size: 22px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: 1px; }
  p { color: rgba(255,255,255,0.75); font-size: 14.5px; line-height: 1.6; }
  a.back { display: inline-block; margin-top: 22px; color: var(--primary); text-decoration: none; font-weight: 700; font-size: 13.5px; text-transform: uppercase; }
</style>
<!-- Google tag (gtag.js) + conversion event — filled in per-project, blank if not configured -->
{{GTAG_HEAD_SNIPPET}}
</head>
<body>
  <div class="box">
    <div class="check">&#10003;</div>
    <h1>Thanks for reaching out!</h1>
    <p>We've received your request and our team will get back to you shortly to schedule your site visit.</p>
    <a class="back" href="index.html">&larr; Back to homepage</a>
  </div>
</body>
</html>
