; Raise PHP upload limits so bulk-selecting many slider / floor plan /
; gallery / amenity images at once doesn't silently truncate $_FILES.
; Read automatically by PHP-FPM/CGI hosting (most GoDaddy cPanel plans).
; Ignored under mod_php (see .htaccess in this same folder instead).
; Note: PHP caches .user.ini for up to 300s (user_ini.cache_ttl), so it
; can take a few minutes after upload before this takes effect.
upload_max_filesize = 25M
post_max_size = 100M
max_file_uploads = 60
max_execution_time = 120
max_input_time = 120
